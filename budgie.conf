
<VirtualHost *:80>

        ServerName budgie.local
        # ServerName budgie.anaguleswaran.nstrife.fr
        DocumentRoot /var/www/projet-annuel/Budgie/public

        <Directory /var/www/projet-annuel/Budgie/public>
                AllowOverride All
                Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>

