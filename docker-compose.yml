services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: budgie_app

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/projet-annuel/Budgie

    depends_on:
      - db


  db:
    image: mariadb:11

    container_name: budgie

    environment:
      MYSQL_DATABASE: budgie
      MYSQL_USER: alicia
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql


volumes:
  mariadb_data: